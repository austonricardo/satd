<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">GitHub SATD Analyzer icon</title>
  <desc id="desc">A code-focused shield with a technical debt warning marker and SATD label.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="panel" x1="28" y1="28" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="warn" x1="72" y1="68" x2="102" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <path d="M64 18 98 30v31c0 24.5-14.6 39.4-34 50-19.4-10.6-34-25.5-34-50V30l34-12Z" fill="#E0F2FE" opacity="0.18"/>

  <g filter="url(#shadow)">
    <rect x="24" y="28" width="80" height="72" rx="14" fill="url(#panel)"/>
    <rect x="24" y="28" width="80" height="18" rx="14" fill="#111827"/>
    <circle cx="38" cy="37" r="3.2" fill="#EF4444"/>
    <circle cx="50" cy="37" r="3.2" fill="#F59E0B"/>
    <circle cx="62" cy="37" r="3.2" fill="#22C55E"/>
  </g>

  <path d="M47 60 36 70l11 10" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M81 60 92 70 81 80" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M68 56 58 84" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>

  <path d="M89 70 108 103H70L89 70Z" fill="url(#warn)" stroke="#FFF7ED" stroke-width="4" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M89 83v10" stroke="#7C2D12" stroke-width="5" stroke-linecap="round"/>
  <circle cx="89" cy="100" r="2.8" fill="#7C2D12"/>

  <rect x="34" y="94" width="43" height="17" rx="8.5" fill="#0F172A"/>
  <text x="55.5" y="106.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#F8FAFC" letter-spacing="0.8">SATD</text>
</svg>
